# Dependabot configuration for automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python: requirements/*.in and the hashed locks compiled from them
  # (scripts/lock.sh). Dependabot reads pyproject.toml, which holds the 7-day
  # cutoff, only from this directory, so it stays the root.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # The locks' pins of transitive dependencies are bumped too
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    # Group minor and patch updates to reduce PR noise
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "Flask*"
          - "gunicorn"
          - "redis"
          - "pydantic"
          - "cryptography"
          - "requests"
          - "APScheduler"
          - "psycopg2*"
          - "sentry-sdk"
        update-types:
          - "minor"
          - "patch"
      # Every other minor and patch update, transitive pins included
      other-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend and Railway configuration packages
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    # @types/node follows the Node major in engines, so move them together by hand
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "npm"
    directory: "/.railway"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"

  # Workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
