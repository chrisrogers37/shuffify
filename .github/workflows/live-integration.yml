name: Live integration tests

# Live-scraper integration tests hit real public Spotify pages, so they run
# only on demand.
on:
  workflow_dispatch:

jobs:
  integration:
    name: Live scraper integration tests
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: testing
      SPOTIFY_CLIENT_ID: test_client_id
      SPOTIFY_CLIENT_SECRET: test_client_secret
      SPOTIFY_REDIRECT_URI: http://localhost:8000/callback
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7, v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements/dev.txt

      - name: Integration tests
        run: pytest tests/ -m integration -v
