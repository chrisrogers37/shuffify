name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css:
    name: Tailwind stylesheet up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compiled stylesheet is committed, so DigitalOcean's deploy-on-push
      # never depends on a build-time download. The cost of that choice is drift:
      # a template edit without a rebuild ships stale CSS silently. This closes it.
      - name: Verify committed CSS matches templates
        run: ./scripts/build-css.sh --check

  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    env:
      # Config is read at import time, so provide test credentials up front.
      # Fixtures override these; production values are never used in CI.
      APP_CONFIG: testing
      SPOTIFY_CLIENT_ID: test_client_id
      SPOTIFY_CLIENT_SECRET: test_client_secret
      SPOTIFY_REDIRECT_URI: http://localhost:8000/callback
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check shuffify/

      # Two branches can hand-pick the same Alembic revision id and git merges
      # them without a conflict, because the filenames differ (#527). The app
      # refuses to boot unless the schema is exactly at head (#503), so an
      # ambiguous head is a failed deploy rather than a migration warning.
      # Pure text analysis: no database, no app import, so it runs here rather
      # than waiting on the test step.
      - name: Migration chain integrity
        run: python scripts/check-migration-chain.py

      - name: Format check (black)
        # Still non-blocking: SR-037 consolidated linting onto ruff but did
        # not reformat the tree, so black drift remains pre-existing.
        run: black --check shuffify/
        continue-on-error: true

      - name: Tests + coverage
        run: |
          pytest tests/ -m "not integration" \
            --cov=shuffify --cov-report=term-missing \
            --cov-fail-under=${COV_MIN}
        env:
          # Baseline is ~84.6%; floor sits a few points under for headroom.
          # Ratchet up as coverage improves.
          COV_MIN: '80'
