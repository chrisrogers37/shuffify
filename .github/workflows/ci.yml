name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # How many parallel legs run the backend test suite. The backend-shard matrix
  # lists 1..TEST_SPLITS, and each leg refuses to run if the two disagree.
  TEST_SPLITS: "5"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and Railway config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            .railway/package-lock.json

      # The React app: generated sources up to date, its unit tests, then the
      # typecheck, build and prerender Vercel runs, and the checks on that output.
      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Generated web sources up to date
        run: |
          npm --prefix web run schemas:check
          npm --prefix web run theme:check
          npm --prefix web run public:check

      - name: Web tests
        run: npm --prefix web test

      - name: Web build
        run: npm --prefix web run build

      - name: Web static output tests
        run: npm --prefix web run test:static

      # The service definition `railway config plan` evaluates.
      - name: Install Railway config dependencies
        run: npm ci --prefix .railway

      - name: Railway config typecheck and tests
        run: |
          npm --prefix .railway run typecheck
          npm --prefix .railway test

  # Everything about the backend that does not depend on how the test suite is
  # divided runs once, here, beside the test shards: lint, the migration chain
  # and the PostgreSQL integration tests.
  backend-checks:
    name: Backend lint and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Config is read at import time, so provide test credentials up front.
      # Fixtures override these; production values are never used in CI.
      APP_CONFIG: testing
      SPOTIFY_CLIENT_ID: test_client_id
      SPOTIFY_CLIENT_SECRET: test_client_secret
      SPOTIFY_REDIRECT_URI: http://localhost:8000/callback
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint (ruff)
        # The whole tree, tests included. Local virtualenvs are excluded in
        # pyproject.toml.
        run: ruff check .

      # Two branches can hand-pick the same Alembic revision id and git merges
      # them without a conflict, because the filenames differ. The app
      # refuses to boot unless the schema is exactly at head, so an
      # ambiguous head is a failed deploy rather than a migration warning.
      # Pure text analysis: no database, no app import, so it runs ahead of the
      # test steps.
      - name: Migration chain integrity
        run: python scripts/check-migration-chain.py

      # PostgreSQL-only behaviour: locks, LISTEN and transactional DDL. Each test
      # module starts a throwaway server from the runner's PostgreSQL binaries;
      # without them every test would skip, so their absence fails the step, as
      # does any other skip (--fail-on-skip). The live Spotify scraper checks
      # stay in the on-demand live-integration workflow.
      - name: PostgreSQL integration tests
        shell: bash
        run: |
          pgbin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          test -x "$pgbin/initdb"
          test -x "$pgbin/pg_ctl"
          PATH="$pgbin:$PATH" pytest tests/ -m integration -q \
            --ignore=tests/services/source_resolver/test_live_scraper_validation.py \
            --fail-on-skip

  # The rest of the suite (everything but the integration tests) in TEST_SPLITS
  # parallel legs. pytest-split divides it by the recorded test times in
  # .test_durations, so every test lands in exactly one leg's share as long as
  # every leg collects the same suite. Each leg proves that by fingerprinting
  # what it collected, and "Backend lint & tests" below compares the fingerprints.
  #
  # The leg holding the longest test cannot finish before that test does, about
  # twenty minutes, so the others finish well ahead of it.
  backend-shard:
    name: Backend tests shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    # Well above the time that leg needs: a hung one fails here, so that
    # "Backend lint & tests", and the deploy waiting on CI, do not hang with it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    env:
      # Config is read at import time, so provide test credentials up front.
      # Fixtures override these; production values are never used in CI.
      APP_CONFIG: testing
      SPOTIFY_CLIENT_ID: test_client_id
      SPOTIFY_CLIENT_SECRET: test_client_secret
      SPOTIFY_REDIRECT_URI: http://localhost:8000/callback
      SECRET_KEY: ci-test-secret-key
      # One collection order in every process that has to agree on it.
      PYTHONHASHSEED: "0"
      TEST_GROUP: ${{ matrix.group }}
    steps:
      - name: Check the matrix covers TEST_SPLITS
        run: test "${{ strategy.job-total }}" = "$TEST_SPLITS"

      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      # The fingerprint of the WHOLE selection, not of this leg's share: every
      # leg must report the same one for the split to be exact. It takes the
      # selection of the next step (tests/ and the marker) without its split
      # arguments. pytest's own count is checked against the ids read, so a line
      # the pattern misses cannot shrink the fingerprinted list unnoticed.
      # --verbosity=-1 lists one test id per line whatever pytest.ini's addopts
      # set (-qq does so only while addopts carry -v).
      - name: Fingerprint the collected suite
        run: |
          pytest --collect-only --verbosity=-1 tests/ -m "not integration" > "$RUNNER_TEMP/collection.txt"
          grep -E '^\S+\.py::' "$RUNNER_TEMP/collection.txt" > "$RUNNER_TEMP/ids.txt"
          collected=$(sed -n -E 's/^([0-9]+)(\/[0-9]+)? tests? collected.*/\1/p' "$RUNNER_TEMP/collection.txt" | tail -n 1)
          read_ids=$(wc -l < "$RUNNER_TEMP/ids.txt")
          echo "pytest collected $collected tests; $read_ids test ids read"
          test "$read_ids" -eq "$collected"
          echo "$(sha256sum < "$RUNNER_TEMP/ids.txt" | cut -d ' ' -f 1) $collected" > "collection-shard-$TEST_GROUP.txt"
          cat "collection-shard-$TEST_GROUP.txt"

      # Coverage goes to this leg's own data file, with no minimum: a leg covers
      # only its share. "Backend lint & tests" combines the legs' data and holds
      # the total to COV_MIN. --store-durations --clean-durations rewrite this
      # leg's copy of the times with exactly the tests it ran; that job merges
      # the copies.
      #
      # least_duration hands the longest tests out first, each to the leg with
      # the least time so far. pytest-split's default, duration_based_chunks,
      # cuts the collection order into contiguous chunks and closes a chunk once
      # it holds an equal share of the total time. One test here outweighs two
      # shares, so that algorithm leaves the last legs with nothing to run.
      #
      # --fail-on-skip: the path and the marker choose what runs, so a skip at
      # run time is a missing precondition and fails the leg. The tests of the
      # other legs are deselected, which is not a skip.
      - name: Run this shard of the tests with coverage
        env:
          COVERAGE_FILE: .coverage.shard-${{ matrix.group }}
        run: |
          cp .test_durations "durations-shard-$TEST_GROUP.json"
          pytest tests/ -m "not integration" \
            --cov=shuffify --cov-report= \
            --splits "$TEST_SPLITS" --group "$TEST_GROUP" \
            --splitting-algorithm least_duration \
            --durations-path "durations-shard-$TEST_GROUP.json" \
            --store-durations --clean-durations \
            --fail-on-skip

      # Uploaded only after a green run: a failed leg publishes nothing.
      - name: Upload the collection fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: collection-shard-${{ matrix.group }}
          path: collection-shard-${{ matrix.group }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.group }}
          path: .coverage.shard-${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload test durations
        uses: actions/upload-artifact@v7
        with:
          name: durations-shard-${{ matrix.group }}
          path: durations-shard-${{ matrix.group }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The one backend check that docs and tooling know by name: they refer to
  # "Backend lint & tests". It runs whatever happened upstream (always(), NOT
  # !cancelled(): a skipped job reports success) and passes only when the lint
  # job and every leg passed, every leg collected the same suite, and the
  # combined coverage reaches COV_MIN.
  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    needs: [backend-checks, backend-shard]
    if: always()
    timeout-minutes: 10
    env:
      # Minimum coverage of the whole suite, the legs combined; ratchet up as
      # coverage improves.
      COV_MIN: '92'
    steps:
      - name: Require the lint job and every test shard to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "backend-checks and backend-shard: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

      - uses: actions/checkout@v7

      - name: Download the collection fingerprints
        uses: actions/download-artifact@v8
        with:
          pattern: collection-shard-*
          path: fingerprints
          merge-multiple: true

      # pytest-split puts each test in exactly one leg's share when every leg
      # collected the same suite: TEST_SPLITS files, one distinct line.
      - name: Require one collected suite across every shard
        run: |
          cat fingerprints/*.txt
          test "$(find fingerprints -type f | wc -l)" -eq "$TEST_SPLITS"
          test "$(sort -u fingerprints/*.txt | wc -l)" -eq 1

      # The legs' times are for refreshing .test_durations when the shards drift
      # apart; this gates nothing. Download the merged file from a green main
      # run and commit it (documentation/guides/testing-harness.md).
      - name: Download test durations
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: durations-shard-*
          path: durations-parts
          merge-multiple: true

      # Rounded to a tenth of a millisecond: at a millisecond about a fifth of the
      # tests round to zero, and least_duration gives all of those to one leg.
      - name: Merge the shards' test durations
        continue-on-error: true
        run: |
          test "$(find durations-parts -type f | wc -l)" -eq "$TEST_SPLITS"
          mkdir merged-durations
          jq -S --indent 4 -s 'add | map_values((. * 10000 | round) / 10000)' durations-parts/*.json > merged-durations/merged.json
          mv merged-durations/merged.json merged-durations/.test_durations

      - name: Upload the merged test durations
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: test-durations
          path: merged-durations/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-parts
          merge-multiple: true

      # The legs measured the same checkout at the same paths, so their data
      # files combine without remapping. Each leg's data lists every file of the
      # package, one it never ran included, so the total is the whole suite's.
      - name: Combine coverage into the run summary
        run: |
          pip install "$(grep -E '^pytest-cov==' requirements/dev.txt)"
          test "$(find coverage-parts -type f | wc -l)" -eq "$TEST_SPLITS"
          coverage combine coverage-parts
          {
            echo "### Backend coverage: $(coverage report --precision=2 --format=total)% (minimum ${COV_MIN}%)"
            echo
            coverage report --precision=2 --format=markdown --skip-covered --sort=cover
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate the single job applied with --cov-fail-under: the total, to a
      # whole percent, must reach COV_MIN.
      - name: Enforce the minimum coverage
        run: coverage report --show-missing --skip-covered --fail-under="$COV_MIN"

  harness:
    name: Harness (fresh PostgreSQL migrations + app boot)
    runs-on: ubuntu-latest
    env:
      HARNESS_SERVICES: external
      HARNESS_PYTHON: python
      DATABASE_URL: postgresql://shuffify@127.0.0.1:5432/shuffify_harness
      REDIS_URL: redis://127.0.0.1:6379/0
    # This job builds a new PostgreSQL 16 database the way every new database
    # is built (`flask create-schema` from the models, then `flask db
    # upgrade`) and boots the real app on it under the harness config:
    # schema gate, Redis sessions and the scheduler live, and the network
    # guard on. Lint and tests are the backend job's, so --quick skips them.
    # The behaviour tests (tests/e2e) then drive that app against the fake
    # Spotify, a browser pass included, whose screenshots are kept as an
    # artifact.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shuffify_harness
          POSTGRES_USER: shuffify
          # A throwaway CI container needs no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shuffify -d shuffify_harness"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      # The harness builds the React frontend, which requires Node 24.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Harness setup
        run: scripts/harness.sh setup --quick

      # The browser pass (tests/e2e/test_pages.py) drives headless Chromium.
      - name: Install headless Chromium
        run: python -m playwright install --with-deps --only-shell chromium

      # --fail-on-skip: every behaviour test must run, the browser pass included.
      - name: Behaviour tests
        timeout-minutes: 30
        run: scripts/harness.sh e2e --fail-on-skip

      - name: Page screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: page-screenshots
          path: .harness/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Harness logs
        if: failure()
        run: |
          cat .harness/migrate.log || true
          cat .harness/app.log || true
          cat .harness/fake-spotify.log || true
          cat .harness/netguard-violations.log || true
