name: Nightly integration tests

# Live-scraper integration tests hit real public Spotify pages, so they run on
# a schedule (not on every PR) and are non-blocking — a flaky external page
# should never gate merges. Use workflow_dispatch to run them on demand.
on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:

jobs:
  integration:
    name: Live scraper integration tests
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: testing
      SPOTIFY_CLIENT_ID: test_client_id
      SPOTIFY_CLIENT_SECRET: test_client_secret
      SPOTIFY_REDIRECT_URI: http://localhost:8000/callback
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Integration tests
        run: pytest tests/ -m integration -v
