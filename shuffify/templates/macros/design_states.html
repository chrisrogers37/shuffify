{# Core error-state component. Explicit inputs stay autoescaped. #}
{% macro error_panel(error_code, error_title, error_message, home_url, icon='info', retry=false) %}
<section class="sh-error-page" aria-labelledby="error-title" aria-describedby="error-message">
    <div class="sh-error-panel sh-surface">
        <div class="sh-error-icon {{ 'sh-error-icon-danger' if icon == 'server' else 'sh-error-icon-warning' }}" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                {% if icon == 'missing' %}
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                {% elif icon == 'server' %}
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                {% else %}
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                {% endif %}
            </svg>
        </div>
        <p class="sh-error-code">Error {{ error_code }}</p>
        <h1 id="error-title" class="sh-error-title sh-heading">{{ error_title }}</h1>
        <p id="error-message" class="sh-error-message sh-text-muted">{{ error_message }}</p>
        <div class="sh-error-actions">
            <a href="{{ home_url }}" class="sh-button">
                <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"></path>
                </svg>
                Back to Dashboard
            </a>
            {% if retry %}
            <button type="button" data-action-click="err-001" class="sh-button-secondary">
                <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Try Again
            </button>
            {% endif %}
        </div>
    </div>
</section>
{% endmacro %}
